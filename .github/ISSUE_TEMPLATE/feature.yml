name: 기능·구현 작업
description: 새 기능이나 구현 작업
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 한국어로 작성해 주세요. 로드맵 단계(docs/ROADMAP.md)와 연결되면 적어 주세요.
  - type: textarea
    id: goal
    attributes: { label: 목표, description: 무엇을 왜 하는지 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 범위와 비범위 }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: 수락 기준
      value: |
        - [ ] 기능과 경계 조건
        - [ ] 권한·보안 영향 검토
        - [ ] 테스트와 실제 실행 근거
        - [ ] 문서 갱신
    validations: { required: true }
  - type: textarea
    id: verification
    attributes: { label: 검증 계획 }
    validations: { required: true }
