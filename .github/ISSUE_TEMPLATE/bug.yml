name: 버그 보고
description: 잘못 동작하는 기능
title: "[fix] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 실제 프롬프트·파일 내용·토큰·개인 경로는 넣지 마세요. 재현에 필요하면 가짜 데이터로 바꿔 주세요.
  - type: textarea
    id: summary
    attributes: { label: 문제 요약 }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: 재현 절차 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 기대 결과 }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: 실제 결과 }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: 버전·환경, placeholder: "커밋 SHA / OS / Claude Code 버전" }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      options: [백엔드·API, 런타임·Claude Code, 조직 설계, 채팅, 웹 UI, 사무실, 프로젝트, 문서·개발 환경]
    validations: { required: true }
