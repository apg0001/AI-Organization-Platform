[package]
name = "ai-org-desktop"
version = "0.4.0"
description = "AI Organization Platform 데스크톱 앱(백엔드 내장, 시스템 트레이, 네이티브 알림)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.6"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
