[project]
name = "ai-org-server"
version = "0.0.1"
description = "AI Organization Platform — local backend (organization, agents, projects, capabilities, runtime)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "sqlalchemy>=2.0.40",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
  "claude-agent-sdk>=0.2.189",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx>=0.28",
  "ruff>=0.14",
  "mypy>=1.18",
  "types-PyYAML",
]

[project.scripts]
ai-org-server = "ai_org.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_org = ["templates/*.json"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["ai_org"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
